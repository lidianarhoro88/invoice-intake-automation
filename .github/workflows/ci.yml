name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Run the pipeline on the sample inbox
        run: invoice-intake --keep-files
      - uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: output/run_report.html

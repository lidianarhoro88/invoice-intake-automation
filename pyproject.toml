[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-intake-automation"
version = "1.0.0"
description = "Supplier invoice intake: PDF extraction, validation against vendor and PO master data, SQLite booking and an exceptions queue."
requires-python = ">=3.10"
authors = [{ name = "Lidiana Houro" }]
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=7", "reportlab>=4"]

[project.scripts]
invoice-intake = "invoice_intake.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
